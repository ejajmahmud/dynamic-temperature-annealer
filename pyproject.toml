[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-temperature-annealer"
version = "0.1.0"
description = "State-dependent decoding temperature and top-p controller that dynamically adapts sampling parameters based on cognitive task type"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
dynamic-temperature-annealer = "dynamic_temperature_annealer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamic_temperature_annealer*"]
